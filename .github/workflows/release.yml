name: Release

# On a version tag, build every platform's native binary on that platform and
# attach them to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      # Let every platform finish, so one run shows every problem.
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            target: x86_64-unknown-linux-musl
            arch: x86_64
            runner: ubuntu-24.04
            setup: rustup target add x86_64-unknown-linux-musl
            build: sh scripts/build-release.sh linux
            package: mkdir -p pkg && cp bin/omapower-x86_64 pkg/omapower && tar -C pkg -czf omapower-linux-x86_64.tar.gz omapower
            asset: omapower-linux-x86_64.tar.gz
          - name: Linux aarch64
            target: aarch64-unknown-linux-musl
            arch: aarch64
            runner: ubuntu-24.04-arm
            setup: rustup target add aarch64-unknown-linux-musl
            build: sh scripts/build-release.sh linux
            package: mkdir -p pkg && cp bin/omapower-aarch64 pkg/omapower && tar -C pkg -czf omapower-linux-aarch64.tar.gz omapower
            asset: omapower-linux-aarch64.tar.gz
          - name: Windows x86_64
            target: x86_64-pc-windows-msvc
            arch: x86_64
            runner: windows-latest
            setup: rustup target add x86_64-pc-windows-msvc
            build: sh scripts/build-release.sh windows
            package: cp dist/omapower-windows-x86_64.exe omapower-windows-x86_64.exe
            asset: omapower-windows-x86_64.exe
          - name: Windows ARM64
            target: aarch64-pc-windows-msvc
            arch: aarch64
            runner: windows-11-arm
            setup: rustup target add aarch64-pc-windows-msvc
            build: sh scripts/build-release.sh windows
            package: cp dist/omapower-windows-aarch64.exe omapower-windows-aarch64.exe
            asset: omapower-windows-aarch64.exe
          - name: macOS
            target: aarch64-apple-darwin
            arch: aarch64
            runner: macos-latest
            setup: rustup target add aarch64-apple-darwin x86_64-apple-darwin
            build: sh scripts/build-release.sh macos
            package: cp dist/omapower-macos.dmg omapower-macos.dmg
            asset: omapower-macos.dmg
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      # Name the architecture: on the Windows ARM runner the default Rust
      # toolchain and uname both report x86_64.
      OMAPOWER_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - run: ${{ matrix.setup }}
      - run: cargo test --release --locked --target ${{ matrix.target }}
      - run: ${{ matrix.build }}
      - run: ${{ matrix.package }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  windows-installer:
    # One setup file for x64 and ARM64 PCs, built from both Windows binaries.
    name: Windows installer
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: omapower-windows-*.exe
          path: dist
          merge-multiple: true
      - name: Install Inno Setup
        run: |
          if [ ! -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup --yes --no-progress
          fi
      - run: sh scripts/build-release.sh windows-installer
      - uses: actions/upload-artifact@v7
        with:
          name: omapower-windows-setup.exe
          path: dist/omapower-windows-setup.exe
          if-no-files-found: error

  publish:
    needs: [build, windows-installer]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
