[package]
name = "brrr"
version = "2.0.1"
edition = "2024"
license = "MIT"
description = "Full power while something heavy is running, then quiet again"
repository = "https://github.com/valvesky/brrr"
rust-version = "1.89"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
notify = { version = "8.2.2", default-features = false, features = ["macos_fsevent"] }
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision", "raw_value"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
signal-hook = "0.4.6"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
png = "0.18.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Power", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Console", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com", "Win32_Security", "Win32_Storage_FileSystem"] }

# Build scripts run on the host, so a target-specific build dependency would
# be missing when cross-compiling for Windows.
[build-dependencies]
embed-manifest = "1.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
