<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- brrr's macOS app icon: the flat icon (brrr.svg) as tinted glass.
       Bolt: Font Awesome Free (CC BY 4.0), https://fontawesome.com/license/free -->
  <defs>
    <path id="bolt" d="M338.8-9.9c11.9 8.6 16.3 24.2 10.9 37.8L271.3 224 416 224c13.5 0 25.5 8.4 30.1 21.1s.7 26.9-9.6 35.5l-288 240c-11.3 9.4-27.4 9.9-39.3 1.3s-16.3-24.2-10.9-37.8L176.7 288 32 288c-13.5 0-25.5-8.4-30.1-21.1s-.7-26.9 9.6-35.5l288-240c11.3-9.4 27.4-9.9 39.3-1.3z"/>
    <!-- 448x512 glyph, scaled 1.03 and centred on the tile -->
    <g id="glyph" transform="translate(281.3 248.3) scale(1.03)"><use xlink:href="#bolt"/></g>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#414b43"/>
      <stop offset="0.55" stop-color="#232925"/>
      <stop offset="1" stop-color="#121512"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.56" r="0.55">
      <stop offset="0" stop-color="#d4f57a" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#d4f57a" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#d4f57a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.60"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="fill" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f3ffc9"/>
      <stop offset="0.45" stop-color="#d4f57a"/>
      <stop offset="1" stop-color="#97c934"/>
    </linearGradient>
    <!-- A smooth fade, not a hard stop: a stop line shows as a seam across the arms -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="44"/></filter>
  </defs>

  <!-- Shadow under the tile -->
  <rect x="100" y="122" width="824" height="824" rx="185" fill="#000000" opacity="0.38" filter="url(#tile-shadow)"/>

  <g clip-path="url(#tile)">
    <!-- Dark tinted glass with light gathered behind the bolt -->
    <rect x="100" y="100" width="824" height="824" fill="url(#body)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- The bolt: halo, body, gloss. No cast shadow: beside the halo it reads
         as dark smears along the bolt's diagonal edges. -->
    <use xlink:href="#glyph" fill="#d4f57a" opacity="0.55" filter="url(#halo)"/>
    <use xlink:href="#glyph" fill="url(#fill)"/>
    <use xlink:href="#glyph" fill="url(#gloss)"/>
    <!-- Curved specular sheen across the upper glass -->
    <path d="M100 100 H924 V392 C760 452 560 470 100 418 Z" fill="url(#sheen)"/>
  </g>

  <!-- Light catching the glass edge -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
